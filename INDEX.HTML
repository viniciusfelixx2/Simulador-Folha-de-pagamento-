<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de Folha de Pagamento 2026</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1 class="titulo">Holerite Digital 2026</h1>
    <p class="subtitulo">Simulador de INSS, IRRF e salário líquido</p>

    <form id="formFolha">
      <label for="salarioBruto">Salário Bruto (R$)</label>
      <input
        type="text"
        id="salarioBruto"
        placeholder="Ex: 5500,00"
      />

      <label for="inss">Desconto INSS (Tabela 2026)</label>
      <input type="text" id="inss" disabled />

      <label for="irrf">Imposto de Renda (isenção até 5k)</label>
      <input type="text" id="irrf" disabled />

      <div class="botoes">
        <button type="submit" class="btn-calcular">Calcular Agora</button>
        <button type="button" class="btn-limpar" id="btnLimpar">Limpar Tudo</button>
      </div>

      <p class="mensagem" id="mensagem"></p>

      <div class="resultado">
        <h2>Salário Líquido Final</h2>
        <p id="liquido">R$ 0,00</p>
      </div>
    </form>

    <p class="rodape">Feito pelo aluno Vincius Das Dores Felix</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
